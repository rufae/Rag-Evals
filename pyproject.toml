[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragevals"
version = "0.1.0"
description = "Evaluación de calidad para sistemas RAG y LLM: recall@k, refusal, fugas, guardrails y gates para CI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8.0"]

[project.scripts]
ragevals = "ragevals.cli:main"

[tool.setuptools.packages.find]
include = ["ragevals*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
